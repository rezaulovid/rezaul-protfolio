<text x="80" y="1450" fill="#A78BFA" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">03 / WHAT I LEARNED</text>
<rect x="80" y="1490" width="1280" height="200" rx="18" fill="#111A2E" stroke="#26314A"/>
<text x="115" y="1545" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="750">Designing for clarity, not just visual polish.</text>
<text x="115" y="1590" fill="#A7B1C5" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400">A useful data product needs understandable labels, responsive layouts,</text>
<text x="115" y="1625" fill="#A7B1C5" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400">clear categories and careful handling of changing information.</text>
