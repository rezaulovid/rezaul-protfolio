<text x="80" y="830" fill="#A78BFA" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">01 / THE CHALLENGE</text>
<text x="80" y="885" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="750">Make price information feel clear and accessible.</text>
<text x="80" y="935" fill="#A7B1C5" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400">The concept brings essential commodities, market comparisons and</text>
<text x="80" y="970" fill="#A7B1C5" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400">price movement into a responsive, Bengali-first experience.</text>
